name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install backend dependencies
        run: npm ci
      - name: Typecheck backend
        run: npx tsc --noEmit
      - name: Run regression tests
        run: npm run test:phase3
      - name: Run benchmark offline checks
        run: npm run test:benchmark
      - name: Verify source-extraction quality guards
        run: npx ts-node src/tests/source.quality.checks.ts
      - name: Test offline OCR staging, review and snapshot integrity (synthetic only)
        run: python3 -m unittest discover -s tests -p 'test_ocr_*.py'
      - name: Check safe isolated snapshot indexing (synthetic only)
        run: npm run test:snapshot-index
      - name: Check approved snapshot RAG routing and provenance (synthetic only)
        run: npm run test:snapshot-query
      - name: Audit complete Chroma snapshot consistency (synthetic only)
        run: npm run test:snapshot-audit
      - name: Verify embedding tag binding for snapshot collections (synthetic only)
        run: npm run test:embedding-pin
      - name: Test experimental claim-aware Trust Score (synthetic only)
        run: npm run test:claim-aware
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Build frontend
        run: npm run build --prefix frontend

  windows-ocr:
    runs-on: windows-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Run actual OCR suite via npm on Windows (19 synthetic tests)
        run: npm run test:ocr
