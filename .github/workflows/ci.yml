name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install backend dependencies
        run: npm ci
      - name: Typecheck backend
        run: npx tsc --noEmit
      - name: Run regression tests
        run: npm run test:phase3
      - name: Run benchmark offline checks
        run: npm run test:benchmark
      - name: Verify source-extraction quality guards
        run: npx ts-node src/tests/source.quality.checks.ts
      - name: Test offline OCR staging (synthetic only)
        run: python3 -m unittest discover -s tests -p 'test_ocr_stage.py'
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Build frontend
        run: npm run build --prefix frontend
